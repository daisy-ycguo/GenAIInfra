kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /home/sdp/.cache/huggingface/hub
        containerPath: /mnt/models
      - hostPath: /usr/bin/habana-container-runtime
        containerPath: /usr/bin/habana-container-runtime
      - hostPath: /etc/habana-container-runtime/config.toml
        containerPath: /etc/habana-container-runtime/config.toml
containerdConfigPatches:
- |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      [plugins."io.containerd.grpc.v1.cri".registry.mirrors]
        [plugins."io.containerd.grpc.v1.cri".registry.mirrors."100.83.111.251:5000"]
          endpoint = ["http://100.83.111.251:5000"]
        [plugins."io.containerd.grpc.v1.cri".registry.configs."100.83.111.251:5000".tls]
          insecure_skip_verify = true
